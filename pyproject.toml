[project]
name = "mubawab-scraper"
version = "0.1.0"
description = "Data pipeline for scraping Mubawab real-estate listings"
readme = "README.md"
authors = [
    { name = "Oumansour Abdellatif", email = "iscsoumansourabdelatif1024@gmail.com" }
]
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pandas>=3.0.6",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "selenium>=4.51.0",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
    "webdriver-manager>=4.1.2",
]

[project.scripts]
mubawab-scraper = "mubawab_scraper:main"
mubawab-scraper-cli = "mubawab_scraper.cli:app"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/mubawab_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=mubawab_scraper --cov-report=term-missing"
markers = ["integration: tests requiring network/Selenium"]

[tool.coverage.run]
source = ["mubawab_scraper"]
omit = ["*/tests/*"]